[project]
name = "battery-sam"
version = "2.0.0"
description = "Salud de la batería de teléfonos Samsung leída por ADB, con dashboard web."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "rich>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]

[project.scripts]
battery-sam = "battery_sam.__main__:main"
battery-sam-cli = "battery_sam.cli:main"

[tool.setuptools]
packages = ["battery_sam", "battery_sam.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
